plugins {
    id 'com.android.application'
}

def providerAuthority = 'io.github.luisfetoga2.stickers.provider'
def buildNumber = (project.findProperty('versionCode') ?: '1') as int
def keystorePath = System.getenv('SIGNING_KEYSTORE_PATH')

android {
    namespace 'io.github.luisfetoga2.stickers'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.luisfetoga2.stickers'
        minSdk 30
        targetSdk 35
        versionCode buildNumber
        versionName "0.1.${buildNumber}"
        manifestPlaceholders = [contentProviderAuthority: providerAuthority]
        buildConfigField 'String', 'CONTENT_PROVIDER_AUTHORITY', "\"${providerAuthority}\""
        // yt-dlp ships Python for each phone CPU type. Every current Android phone is 64-bit ARM.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    packaging {
        jniLibs {
            // yt-dlp runs Python as a program, so the native files must be unpacked on install.
            useLegacyPackaging true
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storeType 'pkcs12'
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias 'sticker'
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
    implementation 'com.google.android.gms:play-services-base:18.5.0'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    // Runs EdgeSAM for Magic Touch.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
    // yt-dlp's library pulls an old Kotlin split into several jars. The BOM keeps all Kotlin jars on one version.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.0.21')
    testImplementation 'junit:junit:4.13.2'
}
